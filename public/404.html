<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FinPlan</title>
    <script>
      (function () {
        var BASE = "/finplan";
        var path = window.location.pathname;
        var rest = "";
        if (path.indexOf(BASE) === 0) {
          rest = path.slice(BASE.length);
        }
        if (!/^\/(en|th)(\/|$)/.test(rest)) {
          rest = rest.replace(/^\/+/, "");
          window.location.replace(
            BASE + "/en/" + rest + window.location.search + window.location.hash
          );
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/finplan/en/" />
  </head>
  <body>
    <p>Redirecting… <a href="/finplan/en/">Go to FinPlan</a></p>
  </body>
</html>
